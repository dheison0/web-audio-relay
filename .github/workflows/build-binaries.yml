name: Build binaries

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          npm ci --prefix web
          npm --prefix web run build
          mkdir -p server/dist
          cp -R web/dist/. server/dist/

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/audio-relay-linux-amd64 ./server
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/audio-relay-windows-amd64.exe ./server
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/audio-relay-macos-amd64 ./server
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/audio-relay-macos-arm64 ./server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audio-relay-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: audio-relay-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" release-assets/* --clobber
